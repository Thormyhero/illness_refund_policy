    <title>病退政策 | 管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f3f0 0%, #ede8e3 50%, #f0ebe5 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

            overflow-x: hidden;
        }

        #app {
            width: 100%;
            min-height: 100vh;
        }

        /* Morandi Color System */
        :root {
            --color-primary: #5b7a6b;
            --color-primary-light: #7a9684;
            --color-secondary: #c4a5a0;
            --color-accent: #8b7d7a;
            --color-dark: #3d3d3d;
            --color-light: #f5f3f0;
            --color-card: #fefdfb;
            --glass-bg: rgba(254, 253, 251, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
